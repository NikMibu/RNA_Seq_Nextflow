name: uveal-melanoma
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Workflow management
  - nextflow>=23.10.0
  
  # Data download
  - sra-tools>=3.0.0
  - entrez-direct>=16.2
  
  # Quality control
  - fastqc>=0.12.1
  - multiqc>=1.15
  
  # Preprocessing
  - trimmomatic>=0.39
  - cutadapt>=4.4
  
  # Alignment
  - star>=2.7.10
  - samtools>=1.17
  - hisat2>=2.2.1
  
  # Quantification
  - subread>=2.0.3
  - htseq>=2.0.0
  
  # R and Bioconductor
  - r-base>=4.3.0
  - bioconductor-dexseq>=1.46.0
  - bioconductor-deseq2>=1.40.0
  - bioconductor-genomicfeatures>=1.52.0
  - bioconductor-genomicalignments>=1.36.0
  
  # R packages for analysis
  - r-tidyverse>=2.0.0
  - r-ggplot2>=3.4.0
  - r-pheatmap>=1.0.12
  - r-rmarkdown>=2.20
  
  # Python utilities
  - python>=3.11
  - pandas>=2.0.0
  - numpy>=1.24.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

